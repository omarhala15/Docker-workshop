[project]
name = "pipline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omar", email = "116946969+omarhala15@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.1.4",
    "tqdm>=4.70.1",
]

[project.scripts]
pipline = "pipline:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
